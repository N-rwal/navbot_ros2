ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.1

    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom_rf2o


    odom0_config: [
        true,  true,  false,
        false, false, false,
        true,  true,  false,
        false, false, false,
        false, false, false
    ]


    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data_raw

    imu0_config: [
        false, false, false,   # position
        false, false, false,   # roll pitch yaw
        false, false, false,   # linear velocity
        false, false, true,    # angular velocity Z
        false, false, false,   # linear acceleration
    ]

    imu0_remove_gravitational_acceleration: false
    predict_to_current_time: true

    imu0_differential: false
    imu0_relative: false

    use_control: false
